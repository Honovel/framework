name: Reusable framework verification

on:
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.0.0-ci
      upload-packages:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run package:build
      - run: npm test

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      HONOVEL_RELEASE_TAG: ${{ inputs.version }}
      HONOVEL_NPM_CACHE: ${{ github.workspace }}/.local-tests/npm-cache
      HONOVEL_PACKAGE_ARTIFACTS: ${{ github.workspace }}/dist/verified-packages
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.local-tests/npm-cache
          key: ${{ runner.os }}-integration-npm-${{ hashFiles('package-lock.json', 'packages/create-honovel/template/**/package.json.template', 'test/fixtures/node-adapter/package.json.template') }}
          restore-keys: |
            ${{ runner.os }}-integration-npm-
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - name: Verify packed packages and generated applications
        run: npm run test:packages
      - name: Upload verified npm and GitHub tarballs
        if: inputs.upload-packages
        uses: actions/upload-artifact@v4
        with:
          name: verified-packages
          path: dist/verified-packages
          if-no-files-found: error
          retention-days: 7
