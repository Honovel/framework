name: Release to npmjs and GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      version: ${{ github.event.release.tag_name }}
      upload-packages: true

  npm:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-packages
          path: dist/verified-packages
      - name: Publish verified public npm packages
        run: npm run release:npm -- --packages-dir dist/verified-packages/npm --skip-existing
        env:
          # Optional bootstrap/fallback. Otherwise npm uses trusted publishing (OIDC).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HONOVEL_RELEASE_TAG: ${{ github.event.release.tag_name }}

  github:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --global npm@11.6.0
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-packages
          path: dist/verified-packages
      - name: Publish verified GitHub packages
        run: npm run release:github -- --packages-dir dist/verified-packages/github --skip-existing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HONOVEL_RELEASE_TAG: ${{ github.event.release.tag_name }}
