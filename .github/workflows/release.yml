name: Release Honovel packages to GitHub Packages
on:
  release:
    types: [published]
permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@honovel'
      # npm 10 / arborist 8 crashes while resolving Nuxt's optional peer
      # graph ("Cannot read properties of null (reading 'edgesOut')").
      # npm 11.6+ contains the arborist fix.
      - name: Use npm 11.6+
        run: npm install --global npm@11.6.0
      - run: npm ci
      - run: npm run package:build
      - name: Run release checks
        run: npm run release:check
        env:
          HONOVEL_RELEASE_TAG: ${{ github.event.release.tag_name }}
      - name: Publish all packages to GitHub Packages
        run: npm run release:github
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HONOVEL_RELEASE_TAG: ${{ github.event.release.tag_name }}
